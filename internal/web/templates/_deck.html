{{define "deckInner"}}
<div class="deck-row">
  <details class="deck">
    <summary>Deck · {{.DeckTotal}}</summary>
    <ul class="deck-list">
      {{range .Deck}}<li><span class="deck-item"><svg class="deck-art" viewBox="0 0 64 64" aria-hidden="true"><use href="/static/art.svg#art_{{.ID}}"/></svg><span class="deck-name">{{.Name}}</span></span><span class="deck-count">×{{.Count}}</span></li>{{end}}
    </ul>
  </details>
  {{if not .Scene.Ending}}
  <div class="deck-actions">
    <form class="scout-form" method="post" action="/game/action" hx-post="/game/action" hx-target="#scene" hx-swap="outerHTML">
      <input type="hidden" name="scout" value="1">
      <button type="submit" class="scout-btn" {{if eq .DeckN 0}}disabled title="The deck is empty"{{end}} title="Reveal the deck's top card — spends your turn">Scout</button>
    </form>
    <form class="shuffle-form" method="post" action="/game/action" hx-post="/game/action" hx-target="#scene" hx-swap="outerHTML swap:120ms settle:400ms">
      <input type="hidden" name="shuffle" value="1">
      <button type="submit" class="shuffle-btn" {{if eq .DiscardN 0}}disabled title="The discard pile is empty"{{else if lt .Stats.Treasury 1}}disabled title="Requires Treasury 1"{{end}} title="Recycle the discard pile into the deck — spends your turn and 1 treasury">
        Shuffle · {{.DiscardN}}
      </button>
    </form>
  </div>
  {{end}}
</div>
<details class="discard">
  <summary>Discard · {{.DiscardN}}</summary>
  <ul class="deck-list">
    {{range .Discard}}<li><span class="deck-item"><svg class="deck-art" viewBox="0 0 64 64" aria-hidden="true"><use href="/static/art.svg#art_{{.ID}}"/></svg><span class="deck-name">{{.Name}}</span></span><span class="deck-count">×{{.Count}}</span></li>{{end}}
  </ul>
</details>
{{end}}
