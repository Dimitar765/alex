<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexander — a card adventure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23151312'/%3E%3Ctext x='8' y='12.5' font-size='12' text-anchor='middle' fill='%23c9a227' font-family='Georgia,serif'%3E%CE%91%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/game.js" defer></script>
  <script src="/static/fx.js" defer></script>
</head>
<body hx-boost="false">
  <header>
    <h1>Alexander</h1>
    <nav class="header-nav">
      <a href="/stats">Chronicle</a>
      <button id="fx-toggle" type="button" title="Toggle effects" aria-pressed="true">
        <svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/static/art.svg#icon-fx"/></svg>
      </button>
      <button id="sfx-toggle" type="button" title="Toggle sound" aria-pressed="true">
        <svg class="icon icon-on" viewBox="0 0 64 64" aria-hidden="true"><use href="/static/art.svg#icon-sound"/></svg>
        <svg class="icon icon-off" viewBox="0 0 64 64" aria-hidden="true"><use href="/static/art.svg#icon-muted"/></svg>
      </button>
      <form method="post" action="/game/new"><button type="submit">New game</button></form>
    </nav>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
