{{define "content"}}
<div class="board">
  <aside class="table-side">
    <section id="hand" class="hand" data-deck="{{.DeckN}}">{{template "handInner" .}}</section>
    <section id="deck">{{template "deckInner" .}}</section>
  </aside>
  <div class="play-side">
    <section id="scene" {{if .Fate}}data-fate="1"{{end}}>{{template "sceneInner" .}}</section>
    <section id="log" {{if not .Log}}hidden{{end}}>{{template "logInner" .}}</section>
  </div>
</div>
{{end}}
