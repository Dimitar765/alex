[package]
name = "alexander"
description = "Alexander — a card adventure (native 3D client)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
alexander-core = { path = "../core" }
bevy = { version = "0.19", features = ["wav", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "alexander"
path = "src/main.rs"
