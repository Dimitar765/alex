[workspace]
resolver = "3"
members = ["crates/core", "crates/client"]

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
dirs = "6"
jiff = { version = "0.2", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
